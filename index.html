<title>MiVote — Haryana 2024</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --line:#eceef3; --line2:#e2e5ec;
  --tx:#1d2433; --tx2:#5f6b81; --tx3:#98a2b3;
  --acc:#5b5bd6; --accbg:#eeeefb; --gn:#12915f; --gnbg:#e7f6ef; --am:#b98407; --ambg:#fdf4dd;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 6px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Inter",sans-serif}
.num{font-variant-numeric:tabular-nums}
#app{max-width:1080px;margin:0 auto;padding:0 16px 70px}
header{background:var(--card);border:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.brand{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.logo .mark svg{width:19px;height:19px;stroke:#fff}
.logo h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.logo h1 span{color:var(--tx3);font-weight:500;font-size:13px;margin-left:6px}
.verified{display:inline-flex;align-items:center;gap:6px;background:var(--gnbg);color:var(--gn);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.selrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--tx2)}
.sel b{color:var(--tx);font-weight:600;margin-left:5px}
.sel .lock{color:var(--tx3);font-size:11px;margin-left:5px}
.crumb{font-size:12.5px;color:var(--tx3);margin:14px 4px 12px}
.crumb a{color:var(--acc);text-decoration:none;cursor:pointer;font-weight:600}
.crumb a:hover{text-decoration:underline}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:780px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{color:var(--tx3);font-weight:500;font-size:12px}
.statc{display:flex;align-items:center;gap:12px}
.statc .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.statc .ic svg{width:20px;height:20px}
.statc .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.statc .l{font-size:12px;color:var(--tx2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#fafaff}
.r{text-align:right}
.bar{height:8px;background:#eef0f5;border-radius:999px;position:relative;min-width:60px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;border-radius:999px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px}
.win{display:inline-flex;align-items:center;gap:4px;background:var(--gnbg);color:var(--gn);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px}
.searchbox{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;color:var(--tx);padding:9px 14px;font-size:13.5px;margin-bottom:10px}
.searchbox:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.othersrow td{background:var(--ambg);cursor:pointer}
.othersrow td:first-child{border-radius:12px 0 0 12px}
.othersrow td:last-child{border-radius:0 12px 12px 0}
.othersrow .lbl{color:var(--am);font-weight:700}
.note{border:1px solid #f2d492;background:var(--ambg);color:var(--am);padding:12px 14px;font-size:13px;margin-top:12px;border-radius:12px}
.footnote{font-size:11.5px;color:var(--tx3);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
/* log in / create account switch on the auth screen */
.segbar{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:4px;margin-bottom:16px}
.seg{flex:1;border:none;background:none;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit}
.seg.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
.btn{background:var(--acc);border:none;color:#fff;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;border-radius:999px}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--accbg);color:var(--acc)}
select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--tx);padding:8px 10px;font-size:13px;max-width:100%}
.insight{border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:13px;color:var(--tx2);background:var(--accbg)}
.insight b{color:var(--tx)}
.vbars{display:flex;align-items:stretch;gap:8px;height:150px;padding-top:6px}
.vbars .vb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0;overflow:hidden}
.vbars .vb i{display:block;width:100%;border-radius:8px 8px 4px 4px}
.vbars .vb span{font-size:9.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.vbars .vb em{font-style:normal;font-size:10.5px;color:var(--tx2);font-weight:600}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:6px}
.legend{font-size:12px;color:var(--tx2);margin-top:10px}
.pill-ok{display:inline-block;background:var(--gnbg);color:var(--gn);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.pill-warn{display:inline-block;background:var(--ambg);color:var(--am);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.demo{color:var(--acc);font-size:11px;font-weight:700}
a.cand{color:var(--tx);cursor:pointer;font-weight:600;border-bottom:1.5px dotted var(--acc)}
a.cand:hover{color:var(--acc)}
.sortbtn{background:var(--bg);border:1px solid var(--line2);color:var(--tx2);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:999px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin:12px 0 5px}
select{width:100%}
.sortbtn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
</style>

</head>

function donut(parts, size, centerTop, centerSub){
  const tot = parts.reduce((a,b)=>a+b.v,0) || 1;
  const R = size/2, r = R*0.62;
  let ang = -Math.PI/2, paths = '';
  parts.forEach(p=>{
    const frac = p.v/tot, a2 = ang + frac*Math.PI*2;
    const big = frac > 0.5 ? 1 : 0;
    const x1 = R+R*Math.cos(ang),   y1 = R+R*Math.sin(ang);
    const x2 = R+R*Math.cos(a2),    y2 = R+R*Math.sin(a2);
    const x3 = R+r*Math.cos(a2),    y3 = R+r*Math.sin(a2);
    const x4 = R+r*Math.cos(ang),   y4 = R+r*Math.sin(ang);
    if(frac > 0.999){
      paths += `<circle cx="${R}" cy="${R}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"/>`;
    } else if(frac > 0.0005){
      paths += `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${p.c}"/>`;
    }
    ang = a2;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">${paths}
    <text x="${R}" y="${R-2}" text-anchor="middle" style="font-size:${size*0.17}px;font-weight:700;fill:var(--tx)">${centerTop}</text>
    <text x="${R}" y="${R+size*0.13}" text-anchor="middle" style="font-size:${size*0.085}px;fill:var(--tx3)">${centerSub}</text></svg>`;
}

function lineChart(series, labels, height){
  // right margin holds the party name printed at the end of each line, so four
  // or five lines can be told apart without matching colours to a legend
  const W = 640, H = height || 250, L = 42, R = 104, T = 14, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const vals = series.flatMap(s=>s.values).filter(v=>v!==null && v!==undefined);
  const top = Math.max(20, Math.ceil((Math.max(...vals, 10) + 8) / 10) * 10);
  const x = i => L + (labels.length === 1 ? iw/2 : i * iw / (labels.length - 1));
  const y = v => T + ih - (v / top) * ih;
  let g = '';
  for(let v = 0; v <= top; v += top/4){
    g += `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#eceef3" stroke-width="1"/>
          <text x="${L-8}" y="${y(v)+4}" text-anchor="end" style="font-size:10.5px;fill:#98a2b3">${v}%</text>`;
  }
  labels.forEach((lb,i)=>{
    g += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" style="font-size:10.5px;fill:${lb.on?'#5f6b81':'#c3c9d4'}">${lb.text}</text>`;
    if(!lb.on) g += `<rect x="${x(i)-26}" y="${T}" width="52" height="${ih}" fill="#f7f8fb" opacity=".7"/>`;
  });
  series.forEach(sr=>{
    let d = '', started = false;
    sr.values.forEach((v,i)=>{
      if(v === null || v === undefined) { started = false; return; }
      d += (started ? ' L' : ' M') + x(i) + ' ' + y(v);
      started = true;
    });
    if(d) g += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round"/>`;
    sr.values.forEach((v,i)=>{
      if(v === null || v === undefined) return;
      g += `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#fff" stroke="${sr.color}" stroke-width="2.5"/>`;
    });
  });

  // A white copy sits behind every label so it stays legible where it crosses a
  // line. Drawn as its own element rather than with paint-order, which older
  // browsers ignore - they would then paint the outline over the text.
  const tx = (px,py,anchor,fill,size,txt) =>
    `<text x="${px}" y="${py}" text-anchor="${anchor}" stroke="#fff" stroke-width="3"
       stroke-linejoin="round" fill="none" style="font-size:${size}px;font-weight:700">${txt}</text>
     <text x="${px}" y="${py}" text-anchor="${anchor}"
       style="font-size:${size}px;font-weight:700;fill:${fill}">${txt}</text>`;

  // the share printed above each point, nudged apart when two lines nearly touch
  labels.forEach((lb,i)=>{
    if(!lb.on) return;
    const pts = series.map(sr=>({c: sr.color, v: sr.values[i]}))
                      .filter(p=>p.v !== null && p.v !== undefined)
                      .map(p=>({...p, ly: y(p.v) - 9}));
    pts.sort((a,b)=>a.ly-b.ly);
    for(let k=1;k<pts.length;k++)
      if(pts[k].ly < pts[k-1].ly + 12.5) pts[k].ly = pts[k-1].ly + 12.5;
    const over = pts.length ? pts[pts.length-1].ly - (T+ih-2) : 0;
    if(over > 0) pts.forEach(p=>p.ly -= over);
    const isLast = i === labels.length-1;
    pts.forEach(p=>{
      g += tx(x(i) + (isLast ? -8 : 8), p.ly, isLast?'end':'start', p.c, 9.5, p.v.toFixed(1)+'%');
    });
  });

  // party name at the end of its own line
  const lastOn = labels.reduce((a,lb,i)=>lb.on?i:a, -1);
  if(lastOn >= 0){
    const ends = series.map(sr=>({n: sr.name, c: sr.color, v: sr.values[lastOn]}))
                       .filter(p=>p.v !== null && p.v !== undefined)
                       .map(p=>({...p, ly: y(p.v) + 3.5}));
    ends.sort((a,b)=>a.ly-b.ly);
    for(let k=1;k<ends.length;k++)
      if(ends[k].ly < ends[k-1].ly + 13) ends[k].ly = ends[k-1].ly + 13;
    const over = ends.length ? ends[ends.length-1].ly - (T+ih) : 0;
    if(over > 0) ends.forEach(p=>p.ly -= over);
    ends.forEach(p=>{
      g += `<line x1="${x(lastOn)+6}" y1="${y(p.v)}" x2="${W-R+4}" y2="${p.ly-3.5}"
             stroke="${p.c}" stroke-width="1" opacity=".45"/>`
        + tx(W-R+8, p.ly, 'start', p.c, 10.5, p.n);
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

/* ---------------- navigation history ---------------- */
var NAV = [];
function pushNav(key, thunk){
  if(NAV.length && NAV[NAV.length-1].key === key) return;   // same screen re-rendered
  NAV.push({key, thunk});
  if(NAV.length > 60) NAV.shift();
}
function goBack(){
  if(NAV.length < 2){ NAV = []; return landing(); }
  NAV.pop();                       // drop the screen we are leaving
  NAV[NAV.length-1].thunk();       // thunks call the unwrapped screen, so nothing re-pushes
}
function backBtn(){
  if(NAV.length < 2) return '';
  return `<button class="sortbtn" onclick="goBack()" style="margin-right:10px">&larr; Back</button>`;
}

const DB_USERS = 'mivote_users', DB_SESSION = 'mivote_session', DB_SAVED = 'mivote_saved';
function lsGet(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return ''+h; }

/* built-in demo account so the app can be reviewed on any device */
const BUILTIN = {id:'nitish', name:'Nitish', pw:'Nitish@123'};
function seedBuiltin(){
  const users = lsGet(DB_USERS, {});
  const want = hash(BUILTIN.pw);
  if(!users[BUILTIN.id] || users[BUILTIN.id].pw !== want){
    users[BUILTIN.id] = {name: BUILTIN.name, email: BUILTIN.id, pw: want,
                         joined: '2026-08-31', verified: true, builtin: true};
    lsSet(DB_USERS, users);
  }
}

function currentUser(){ const e = lsGet(DB_SESSION, null); return e ? (lsGet(DB_USERS, {})[e] || null) : null; }

// Signing up and logging in both run through the OTP flow further down
// (startSignup / startLogin / verifyOtp); there is no password-only path in.
function logOut(){ localStorage.removeItem(DB_SESSION); NAV = []; paintHeader(); authMode='login'; authScreen(); }

/* saved villages: CREATE / READ / UPDATE / DELETE */
function savedAll(){
  const u = currentUser(); if(!u) return [];
  return lsGet(DB_SAVED, {})[u.email] || [];
}
function savedWrite(list){
  const u = currentUser(); if(!u) return;
  const all = lsGet(DB_SAVED, {}); all[u.email] = list; lsSet(DB_SAVED, all);
}
function savedId(ac, v){ return ac + '||' + v; }
function isSaved(ac, v){ return savedAll().some(x=>x.id === savedId(ac,v)); }
function saveVillage(ac, v, note){
  const list = savedAll();
  if(list.some(x=>x.id===savedId(ac,v))) return false;
  list.push({id: savedId(ac,v), ac, village: v, note: note||'',
             added: new Date().toISOString().slice(0,10)});
  savedWrite(list); return true;
}
function updateNote(id, note){
  const list = savedAll(); const item = list.find(x=>x.id===id);
  if(item){ item.note = note; item.edited = new Date().toISOString().slice(0,10); savedWrite(list); }
}
function deleteSaved(id){ savedWrite(savedAll().filter(x=>x.id!==id)); }

const MAIL = {
  publicKey:  'ZvtO3augV3YviVePo',
  serviceId:  'service_xgtj957',
  templateId: 'template_h7ejygs',
};
const isEmail = a => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a || '');

/* ---------------- OTP verification ----------------
   One flow serves both journeys. Signing up and logging in each issue a
   4-digit code, so a password alone is never enough to reach an account.
   `purpose` tells verifyOtp what to do once the code checks out.          */
var pendingOtp = null;
const OTP_TTL = 120000, OTP_MAX_TRIES = 3, OTP_LEN = 4;

// Can this code actually be emailed? Needs the keys, the SDK, and a real
// address - the built-in reviewer account signs in as "Nitish", not an inbox.
function canEmailOtp(){
  return !!(MAIL.publicKey && MAIL.serviceId && MAIL.templateId
            && typeof emailjs !== 'undefined' && pendingOtp && isEmail(pendingOtp.email));
}

function otpStatus(html){
  const el = document.getElementById('otpStatus');
  if(el) el.innerHTML = html;
}

// Fire the email and report back in place, so the code box never gets wiped
// mid-typing by a re-render.
function sendOtpEmail(){
  if(!canEmailOtp()){
    pendingOtp.delivery = 'onscreen';
    return otpStatus(demoBanner());
  }
  // hold onto this attempt: the user may verify, resend or leave the screen
  // before the network call comes back, and by then pendingOtp may be gone
  const otp = pendingOtp;
  const stale = () => pendingOtp !== otp;
  otp.delivery = 'sending';
  otpStatus(`<div class="footnote" style="border:none;padding-top:0;margin-top:0">Sending your code…</div>`);
  try{ emailjs.init({publicKey: MAIL.publicKey}); }catch(e){}
  emailjs.send(MAIL.serviceId, MAIL.templateId, {
    passcode: otp.code,
    to_name:  otp.name || 'there',
    to_email: otp.email,
  }).then(()=>{
    if(stale()) return;
    otp.delivery = 'sent';
    otpStatus(`<div class="insight" style="margin:12px 0 0">Code sent to
      <b>${otp.email}</b>. Check your inbox, and the spam folder if it is not there.</div>`);
  }).catch(err=>{
    console.warn('EmailJS send failed:', err);
    if(stale()) return;
    // never strand the user: fall back to the on-screen code
    otp.delivery = 'onscreen';
    otpStatus(demoBanner('Email could not be sent just now, so here is your code.'));
  });
}

// Shown only when there is nowhere to email: the built-in demo account, or a
// failed send. Deliberately quiet - it is a fallback, not the normal path.
function demoBanner(reason){
  return `<div class="insight" style="margin:12px 0">
    ${reason || 'Demo account — the code appears here instead of an inbox.'}
    <div style="font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--tx);margin-top:6px">${pendingOtp.code}</div>
  </div>`;
}

const newCode = () => String(Math.floor(Math.random() * Math.pow(10, OTP_LEN)))
                        .padStart(OTP_LEN, '0');

function startSignup(name, email, pass){
  email = (email||'').trim().toLowerCase();
  if(!name || !email || !pass) return 'Please fill in every field.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return 'That email address does not look right.';
  if(pass.length < 6) return 'Password must be at least 6 characters.';
  if(lsGet(DB_USERS, {})[email]) return 'An account with that email already exists — try logging in.';
  pendingOtp = {purpose:'signup', name: name.trim(), email, pass,
                code: newCode(), sent: Date.now(), tries: 0};
  return null;
}

// the password is checked BEFORE a code is issued, so a wrong password never
// reaches the second step
function startLogin(email, pass){
  email = (email||'').trim().toLowerCase();
  if(!email || !pass) return 'Please enter your username and password.';
  const u = lsGet(DB_USERS, {})[email];
  if(!u) return 'No account found with that username.';
  if(u.pw !== hash(pass)) return 'Wrong password.';
  pendingOtp = {purpose:'login', name: u.name, email, code: newCode(),
                sent: Date.now(), tries: 0};
  return null;
}

function otpExpired(){ return !pendingOtp || (Date.now() - pendingOtp.sent) > OTP_TTL; }

function otpBack(msg){
  const p = pendingOtp && pendingOtp.purpose === 'login' ? 'login' : 'signup';
  pendingOtp = null; authMode = p;
  return authScreen(msg);
}

function resendOtp(){
  if(!pendingOtp) return otpBack();
  pendingOtp.code = newCode();
  pendingOtp.sent = Date.now();
  pendingOtp.tries = 0;
  pendingOtp.delivery = null;          // clear so a fresh code really is sent
  otpScreen('A new code has been sent.');
}

function verifyOtp(){
  if(!pendingOtp) return otpBack('Please start again.');
  if(otpExpired()) return otpScreen('That code has expired. Tap Resend to get a new one.');
  const entered = (document.getElementById('otpInput').value||'').trim();
  if(!new RegExp('^\\d{'+OTP_LEN+'}$').test(entered))
    return otpScreen(`Enter the ${OTP_LEN}-digit code.`);
  if(entered !== pendingOtp.code){
    pendingOtp.tries++;
    if(pendingOtp.tries >= OTP_MAX_TRIES)
      return otpBack('Too many incorrect codes. Please start again.');
    return otpScreen(`Incorrect code. ${OTP_MAX_TRIES - pendingOtp.tries} attempt(s) left.`);
  }
  if(pendingOtp.purpose === 'signup'){
    const users = lsGet(DB_USERS, {});
    users[pendingOtp.email] = {name: pendingOtp.name, email: pendingOtp.email,
      pw: hash(pendingOtp.pass), joined: new Date().toISOString().slice(0,10), verified: true};
    lsSet(DB_USERS, users);
  }
  lsSet(DB_SESSION, pendingOtp.email);
  pendingOtp = null;
  paintHeader();
  landing();
}

function otpScreen(msg){
  navchips(false);
  const signup = pendingOtp.purpose === 'signup';
  const left = Math.max(0, Math.ceil((OTP_TTL - (Date.now() - pendingOtp.sent))/1000));
  view.innerHTML = `
  <div style="max-width:400px;margin:36px auto 0">
    ${crumb([['MiVote','landing()'],[signup ? 'Verify email' : 'Verify it is you', null]])}
    <div class="card">
      <h3>${signup ? 'Verify your email' : 'One more step'}</h3>
      <p style="color:var(--tx2);font-size:13.5px">${isEmail(pendingOtp.email)
        ? `We sent a ${OTP_LEN}-digit code to <b style="color:var(--tx)">${pendingOtp.email}</b>.`
        : `Enter the ${OTP_LEN}-digit code to confirm it is you.`}</p>
      ${msg ? `<div class="note" style="margin-bottom:12px">${msg}</div>` : ''}
      <div id="otpStatus"></div>
      <input id="otpInput" class="searchbox" inputmode="numeric" maxlength="${OTP_LEN}"
             placeholder="Enter ${OTP_LEN}-digit code"
             style="text-align:center;letter-spacing:.4em;font-size:20px;font-weight:600"
             oninput="if(this.value.length===${OTP_LEN}) verifyOtp()"
             onkeydown="if(event.key==='Enter') verifyOtp()">
      <button class="btn" style="width:100%" onclick="verifyOtp()">
        ${signup ? 'Verify and create account' : 'Verify and log in'}</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px">
        <span style="color:var(--tx3)">${left>0 ? 'Code expires in '+left+'s' : 'Code expired'}</span>
        <a onclick="resendOtp()" style="color:var(--acc);font-weight:600;cursor:pointer">Resend code</a>
      </div>
      <div class="footnote">Codes expire after 2 minutes and allow 3 attempts.</div>
    </div>
  </div>`;
  const box = document.getElementById('otpInput');
  if(box) box.focus();
  // re-rendering the screen (resend, wrong code) must not re-send the email
  if(!pendingOtp.delivery) sendOtpEmail();
  else if(pendingOtp.delivery === 'onscreen') otpStatus(demoBanner());
  window.scrollTo(0,0);
}

function doAuth(){
  const email = document.getElementById('auEmail').value;
  const pass  = document.getElementById('auPass').value;
  // both journeys now go through the code step
  const err = authMode === 'signup'
    ? startSignup(document.getElementById('auName').value, email, pass)
    : startLogin(email, pass);
  if(err) return authScreen(err);
  return otpScreen();
}

function villageVotes(ac, v){
  const d = DATA[ac];
  return (d && d.villages && d.villages[v]) ? d.villages[v].valid : 0;
}
function saveNote(id){
  const el = document.getElementById('note_' + btoa(id).replace(/=/g,''));
  updateNote(id, el ? el.value : '');
  myList('Note saved.');
}
function removeSaved(id){
  deleteSaved(id);
  myList('Village removed from your list.');
}
function toggleSave(ac, v){
  if(!currentUser()){ authMode='signup'; return authScreen('Create a free account to save villages.'); }
  if(isSaved(ac,v)){ deleteSaved(savedId(ac,v)); } else { saveVillage(ac, v, ''); }

function crumb(parts){
  const trail = parts.map(p=> p[1]!==null?`<a onclick="${p[1]}">${p[0]}</a>`
                : `<span style="color:var(--tx2);font-weight:600">${p[0]}</span>`).join('  ›  ');
  return '<div class="crumb" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">'
       + backBtn() + '<span>' + trail + '</span></div>';
}
var SENTIMENT = null;
async function loadSentiment(){
  if(SENTIMENT !== null) return SENTIMENT;
  try{
    const r = await fetch('data/sentiment.json');
    SENTIMENT = r.ok ? await r.json() : {seats:{}};
  }catch(e){ SENTIMENT = {seats:{}}; }
  return SENTIMENT;
}
function sentimentCard(ac){
  const S = SENTIMENT && SENTIMENT.seats ? SENTIMENT.seats[ac] : null;
  const d = DATA[ac];
  const top = (d && d.cands ? d.cands : []).slice(0,5);
  if(!top.length) return '';
  // only show this card where we actually have scored coverage
  const scored = S && top.some(c => S[c.n] && S[c.n].score !== null && S[c.n].score !== undefined);
  if(!scored) return '';
  const rows = top.map(c=>{
    const e = S ? S[c.n] : null;
    if(!e || e.score === null || e.score === undefined){
      return `<tr><td style="font-weight:600">${c.n} ${chipP(c.p)}</td>
        <td colspan="2" style="color:var(--tx3);font-size:12.5px">Not enough recent coverage to score${e&&e.articles?` (${e.articles} article${e.articles>1?'s':''})`:''}</td></tr>`;
    }
    const good = e.score >= 50;
    const col = good ? 'var(--gn)' : '#c23b3b';
    const bg = good ? 'var(--gnbg)' : '#fdecec';
    return `<tr><td style="font-weight:600">${c.n} ${chipP(c.p)}</td>
      <td style="width:45%"><div class="bar"><i style="width:${e.score}%;background:${col}"></i></div>
        <div style="font-size:11.5px;color:var(--tx3);margin-top:4px">${e.summary||''}</div>
        ${(e.sources||[]).length? `<div style="margin-top:6px">${e.sources.map(s=>`<a href="${s.u}" target="_blank" style="color:var(--acc);font-size:11.5px;text-decoration:none">• ${s.t} <span style="color:var(--tx3)">(${s.s})</span></a><br>`).join('')}</div>`:''}
      </td>
      <td class="r"><span style="background:${bg};color:${col};font-weight:700;border-radius:999px;padding:4px 12px">${e.score}</span>
        <div style="font-size:11px;color:var(--tx3);margin-top:4px">${e.articles||0} articles</div></td></tr>`;
  }).join('');
  return `<div class="card mb">
    <h3>Media sentiment <span class="sub">automated tone of news coverage · not a public opinion poll</span></h3>
    <table><tbody>${rows}</tbody></table>
    <div class="note">This score reflects how a candidate has been written about in news articles we could retrieve — it does not measure voter opinion, support, or likely results. Scores above 50 lean positive, below 50 lean negative. Sources are linked so you can judge for yourself.${SENTIMENT&&SENTIMENT.updated?` Last updated ${SENTIMENT.updated}.`:''}</div>
  </div>`;
}

function syncFinder(){
  const stv = document.getElementById('fSt').value;
  const elv = document.getElementById('fEl').value;
  const lsSel = document.getElementById('fLs'), acSel = document.getElementById('fAc');
  if(!stv || !HAS_DATA[stv]){
    lsSel.innerHTML = '<option value="">Choose a state first</option>'; lsSel.disabled = true;
    acSel.innerHTML = '<option value="">Choose a state first</option>'; acSel.disabled = true;
    return;
  }
  // Only Vidhan Sabha 2024 covers all 90 seats. For any other election, narrow
  // both lists to the constituencies that actually hold that data rather than
  // offering pages that would come up empty.
  const pool = acsFor(elv);
  const partial = pool.length < DIR.length;
  const seats = LS_ORDER.filter(l => pool.some(a => a.ls === l));
  const keepLs = seats.includes(lsSel.value) ? lsSel.value : (partial && seats.length===1 ? seats[0] : '');
  lsSel.disabled = false;
  lsSel.innerHTML = (seats.length>1 ? `<option value="">All ${seats.length} Lok Sabha seats…</option>` : '') +
    seats.map(l=>`<option ${l===keepLs?'selected':''}>${l}</option>`).join('');
  const lsv = lsSel.value;
  const acs = pool.filter(a => !lsv || a.ls === lsv).map(a=>a.n).sort();
  acSel.disabled = false;
  acSel.innerHTML = `<option value="">${
      partial ? `All ${acs.length} seat${acs.length>1?'s':''} with this data`
              : (lsv ? 'All 9 seats in '+lsv : 'All 90 assembly seats…')}</option>` +
    acs.map(a=>`<option>${a}</option>`).join('');
  const hint = document.getElementById('finderHint');
  const lbl = (ELECTION_OPTIONS.find(e=>e.id===elv)||{}).label;
  if(hint) hint.innerHTML = partial

       Open a village there and use <b>Compare</b> to see it across every election we hold.`

const partyKey = p => (p && PARTY_ORDER.includes(p)) ? p : 'Others / IND';

// Each election is a layer on the same constituency file: vs2024 lives at the
// top level, later elections in a block of their own (d.ls2024, d.vs2019 ...).
function layer(eid, ac){
  const d = DATA[ac]; if(!d) return null;
  if(eid === 'vs2024') return d.villages ? d : null;
  return d[eid] || null;
}

function villageShares(eid, ac, v){
  const d = layer(eid, ac);
  if(!d || !d.villages || !d.villages[v]) return null;
  const vd = d.villages[v], out = {};
  d.cands.forEach(c=>{
    const k = partyKey(c.p);
    out[k] = (out[k]||0) + (vd.votes[String(c.i)]||0);
  });
  const tot = vd.valid || Object.values(out).reduce((a,b)=>a+b,0);
  const pct = {}; Object.keys(out).forEach(k=> pct[k] = tot? 100*out[k]/tot : 0);
  return {votes: out, pct, total: tot, winner: Object.entries(out).sort((a,b)=>b[1]-a[1])[0]};
}

var compareMode = 'elections';
function openCompare(ac, v1){
  const d = DATA[ac];
  const names = Object.keys(d.villages).sort();
  v1 = v1 || names[0];
  const opts = sel => names.map(n=>`<option ${n===sel?'selected':''}>${n.replace(/</g,'')}</option>`).join('');
  const tab = (id,label)=>`<button class="sortbtn ${compareMode===id?'on':''}" onclick="compareMode='${id}';openCompare('${ac}', document.getElementById('cmpA').value)">${label}</button>`;
  view.innerHTML = crumb([...acCrumb(ac),[ac,`openAC('${ac}')`],['Compare',null]]) + `
  <div class="card mb">
    <h3>Compare <span class="sub" style="display:flex;gap:6px">${tab('elections','Across elections')}${tab('villages','Village vs village')}</span></h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select id="cmpA" onchange="renderCompare('${ac}')">${opts(v1)}</select>
      <span id="vsLbl" style="color:var(--tx3);font-weight:600;display:${compareMode==='villages'?'':'none'}">vs</span>
      <select id="cmpB" onchange="renderCompare('${ac}')" style="display:${compareMode==='villages'?'':'none'}">
        <option value="__AC__">— whole constituency —</option>${opts(names.find(n=>n!==v1))}</select>
    </div>
    <div id="cmpout" class="mt"></div>
  </div>`;
  renderCompare(ac);
  window.scrollTo(0,0);
}

function renderCompare(ac){
  if(compareMode === 'elections') return renderAcrossElections(ac);
  return renderVillageVsVillage(ac);
}

function renderAcrossElections(ac){
  const v = document.getElementById('cmpA').value;
  // Columns run oldest to newest. The 2024 Lok Sabha poll was held in May and the
  // Vidhan Sabha in October, so LS 2024 comes BEFORE VS 2024 - listing them the
  // other way round made every gain read as a loss.
  const TIMELINE = ['ls2019','vs2019','ls2024','vs2024'];
  // availability is per constituency, not global - Lok Sabha 2024 currently
  // exists for the Sirsa segments only
  const data = TIMELINE.map(id=>({e: ELECTIONS.find(e=>e.id===id), s: villageShares(id, ac, v)}));
  const live = data.filter(x=>x.s);
  const parties = PARTY_ORDER.filter(p => live.some(x => (x.s.pct[p]||0) > 0));
  const chgLbl = live.length>1
    ? `${live[live.length-2].e.short} → ${live[live.length-1].e.short}` : 'Change';
  const head = `<tr><th>Party</th>${data.map(x=>`<th class="r" style="${x.s?'':'color:var(--tx3)'}">${x.e.short}</th>`).join('')}${live.length>1?`<th class="r">${chgLbl}</th>`:''}</tr>`;
  const rows = parties.map(p=>{
    const cells = data.map(x=>{
      if(!x.s) return `<td class="r" style="color:var(--tx3)">—</td>`;
      // a party that fielded nobody is not the same as one that polled zero
      if(!(p in x.s.pct)) return `<td class="r" style="color:var(--tx3)" title="did not contest">—</td>`;
      const pctv = x.s.pct[p]||0, vts = x.s.votes[p]||0;
      // turnout differs between elections, so the count is not recoverable from
      // the share alone - show both
      return `<td class="r"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
        <div class="bar" style="width:70px"><i style="width:${pctv}%;background:${pc(p.split(' ')[0])}"></i></div>
        <span class="num" style="font-weight:600;min-width:44px">${pctv.toFixed(1)}%</span></div>
        <div class="num" style="font-size:11px;color:var(--tx3)">${fmt(vts)} votes</div></td>`;
    }).join('');
    let chg = '';
    if(live.length>1){
      // newest minus the one before it, both in chronological order
      const B = live[live.length-1].s, A = live[live.length-2].s;
      if(!(p in B.pct) && !(p in A.pct)){
        chg = `<td class="r" style="color:var(--tx3)">—</td>`;
      } else {
        const dv = (B.pct[p]||0)-(A.pct[p]||0), dvv = (B.votes[p]||0)-(A.votes[p]||0);
        chg = `<td class="r"><div class="num" style="font-weight:700;color:${dv>0?'var(--gn)':'#c23b3b'}">${dv>0?'+':''}${dv.toFixed(1)}</div>
          <div class="num" style="font-size:11px;color:var(--tx3)">${dvv>0?'+':''}${fmt(dvv)} votes</div></td>`;
      }
    }
    return `<tr><td>${chipP(p.split(' ')[0])}</td>${cells}${chg}</tr>`;
  }).join('');
  const winRow = `<tr><td style="font-weight:700">Village winner</td>${data.map(x=>
      x.s ? `<td class="r" style="font-weight:600">${x.s.winner[0]}</td>` : `<td class="r" style="color:var(--tx3)">—</td>`).join('')}${live.length>1?'<td></td>':''}</tr>`;
  const turnRow = `<tr><td style="font-weight:700">Valid votes polled</td>${data.map(x=>
      x.s ? `<td class="r num" style="font-weight:600">${fmt(x.s.total)}</td>` : `<td class="r" style="color:var(--tx3)">—</td>`).join('')}${
      live.length>1?`<td class="r num" style="color:var(--tx3)">${
        (live[live.length-1].s.total-live[live.length-2].s.total>0?'+':'')
        + fmt(live[live.length-1].s.total-live[live.length-2].s.total)}</td>`:''}</tr>`;
  // an empty column means one of two different things - say which
  const d0 = DATA[ac];
  const pending = data.filter(x=>!x.s && !d0[x.e.id]).map(x=>x.e.label);
  const notHere = data.filter(x=>!x.s && d0[x.e.id]).map(x=>x.e.short);
  // chronological trend: LS 2019 -> VS 2019 -> LS 2024 -> VS 2024
  const ORDER = ['ls2019','vs2019','ls2024','vs2024'];
  const byId = Object.fromEntries(data.map(x=>[x.e.id, x]));
  const labels = ORDER.map(id=>({text: ELECTIONS.find(e=>e.id===id).short, on: !!(byId[id] && byId[id].s)}));
  // null, not zero, where the party fielded no candidate - the line breaks
  // rather than diving to the axis and implying a collapse in support
  const series = parties.map(p=>({
    name: p.split(' ')[0], color: pc(p.split(' ')[0]),
    values: ORDER.map(id => (byId[id] && byId[id].s && (p in byId[id].s.pct))
                            ? byId[id].s.pct[p] : null)
  }));
  const liveCount = labels.filter(l=>l.on).length;
  document.getElementById('cmpout').innerHTML = `
  <div class="card" style="box-shadow:none;border-color:var(--line);margin-bottom:12px">
    <h3>Vote-share trend <span class="sub">${v}${live.length < ELECTIONS.length
      ? ' · shaded columns are elections not yet loaded'
      : ' · four elections, oldest to newest'}</span></h3>
    ${lineChart(series, labels)}
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">
      ${parties.map(p=>`<span style="display:flex;align-items:center;gap:6px;font-size:12.5px">
        <span style="width:14px;height:3px;border-radius:2px;background:${pc(p.split(' ')[0])}"></span>${p}</span>`).join('')}
    </div>
    ${liveCount < 2 ? `<div class="footnote">One election is loaded, so each party shows a single point.
      The line joins up as Lok Sabha 2024 and the 2019 elections are added.</div>` : ''}
  </div>
  <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${rows}${turnRow}${winRow}</tbody></table></div>
  ${(()=>{
    if(live.length<2) return `<div class="insight mt">Showing how <b>${v}</b> voted, party by party,
      in every election we hold data for.</div>`;
    const A = live[live.length-2], B = live[live.length-1];
    const moves = parties.map(p=>({p, d:(B.s.pct[p]||0)-(A.s.pct[p]||0)}))
                         .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    const up = moves.find(m=>m.d>0), down = moves.find(m=>m.d<0);
    const flip = A.s.winner[0] !== B.s.winner[0];
    return `<div class="insight mt">Between <b>${A.e.label}</b> and <b>${B.e.label}</b>,
      <b>${v}</b> moved ${up?`<b>${up.d.toFixed(1)} points towards ${up.p.split(' ')[0]}</b>`:'little'}${
        down?` and ${Math.abs(down.d).toFixed(1)} away from ${down.p.split(' ')[0]}`:''}.
      ${flip?`The village changed hands — ${A.s.winner[0]} to <b>${B.s.winner[0]}</b>.`
            :`${B.s.winner[0]} held the village in both.`}</div>`;
  })()}
  ${notHere.length? `<div class="note">${notHere.join(' · ')} is loaded for this constituency, but not for
    <b>${v}</b>. The Lok Sabha Form 20 groups town booths under a single station name, so wards inside a
    town cannot be separated the way the assembly sheet allows.</div>`:''}
  ${pending.length? `<div class="note">Coming next: ${pending.join(' · ')}. These columns fill in automatically once the data is added — no change needed to this page.</div>`:''}
  <div class="footnote">Columns run oldest to newest. In 2024 the Lok Sabha was polled in May and the
    Vidhan Sabha in October, so a positive change means the party <b>gained</b> ground over those five months.
    Compared party-wise, not candidate-wise, because candidates differ between elections. Shares are of valid
    EVM votes polled in this village; postal votes are counted at constituency level and are not in Form 20.</div>`;
}

function renderVillageVsVillage(ac){
  const d = DATA[ac];
  const a = document.getElementById('cmpA').value;
  const bsel = document.getElementById('cmpB').value;
  const getShares = (votesObj, valid) => d.cands.map(c=>({n:c.n,p:c.p, s: valid? 100*(votesObj[String(c.i)]||0)/valid : 0, v: votesObj[String(c.i)]||0}));
  const va = d.villages[a];
  const A = getShares(va.votes, va.valid);
  let B, bl;
  if(bsel==='__AC__'){
    const tot = d.cands.reduce((s,c)=>s+c.v,0);
    B = d.cands.map(c=>({n:c.n,p:c.p,s:100*c.v/tot,v:c.v})); bl = ac+' (all)';
  } else { const vb=d.villages[bsel]; B = getShares(vb.votes, vb.valid); bl = bsel; }
  const top = d.cands.filter(c=>c.t4);
  // share alone hides how much weight a village carries - 58% of 400 votes is a
  // smaller prize than 19% of 5,000 - so print the count under every share
  const cell = (sh, dim) => `<td class="r"><div class="num" style="font-weight:${dim?600:700};
      color:${dim?'var(--tx2)':'var(--tx)'}">${sh.s.toFixed(1)}%</div>
    <div class="num" style="font-size:11px;color:var(--tx3)">${fmt(sh.v)}</div></td>`;
  const rows = top.map(c=>{
    const sa=A.find(x=>x.n===c.n), sb=B.find(x=>x.n===c.n);
    const diff = sa.s-sb.s, dv = sa.v-sb.v;
    return `<tr><td style="font-weight:600">${c.n}<br>${chipP(c.p)}</td>
    <td style="width:22%"><div class="bar"><i style="width:${sa.s}%;background:${pc(c.p)}"></i></div></td>
    ${cell(sa,false)}
    <td style="width:22%"><div class="bar"><i style="width:${sb.s}%;background:${pc(c.p)};opacity:.5"></i></div></td>
    ${cell(sb,true)}
    <td class="r"><div class="num" style="font-weight:700;color:${diff>0?'var(--gn)':'#c23b3b'}">${diff>0?'+':''}${diff.toFixed(1)}</div>
      <div class="num" style="font-size:11px;color:var(--tx3)">${dv>0?'+':''}${fmt(dv)}</div></td></tr>`;
  }).join('');
  const totA = A.reduce((s,x)=>s+x.v,0), totB = B.reduce((s,x)=>s+x.v,0);
  const totRow = `<tr><td style="font-weight:700">Valid votes polled</td><td></td>
    <td class="r num" style="font-weight:700">${fmt(totA)}</td><td></td>
    <td class="r num" style="font-weight:700;color:var(--tx2)">${fmt(totB)}</td>
    <td class="r num" style="color:var(--tx3)">${totB?(totA/totB).toFixed(2)+'×':''}</td></tr>`;
  const wA = A.slice().sort((x,y)=>y.v-x.v)[0], wB = B.slice().sort((x,y)=>y.v-x.v)[0];
  document.getElementById('cmpout').innerHTML = `
  <div style="overflow-x:auto"><table><thead><tr><th>Candidate</th><th>${a}</th><th class="r">Share · votes</th><th>${bl}</th><th class="r">Share · votes</th><th class="r">Δ pts · votes</th></tr></thead>
  <tbody>${rows}${totRow}</tbody></table></div>
  <div class="insight mt">${a} leader: <b>${wA.n} (${wA.p})</b> · ${bl} leader: <b>${wB.n} (${wB.p})</b>${wA.p!==wB.p?' — <b>different winners</b>':''}</div>
  <div class="footnote">Percentages are of valid EVM votes polled in each place, so they are comparable
    even when one is far larger than the other. The vote counts underneath show that difference in size.</div>`;
}

/* record each screen in the back-history */
(function(){
  const screens = {
    landing: landing, home: home, openLS: openLS, openAC: openAC, openVill: openVill,
    openCand: openCand, openCompare: openCompare, myList: myList,
    aboutFounder: aboutFounder, authScreen: authScreen, otpScreen: otpScreen
  };
  const PUBLIC = {authScreen:1, otpScreen:1};
  Object.keys(screens).forEach(name=>{
    const fn = screens[name];
    globalThis[name] = function(){
      const args = Array.prototype.slice.call(arguments);
      if(!PUBLIC[name] && !currentUser()){        // must be signed in
        authMode = 'login';
        return screens.authScreen('Please log in to use MiVote.');
      }
      const key = name + '|' + args.filter(a=>typeof a !== 'object').join('|');
      if(name === 'landing') NAV = [];
      pushNav(key, ()=> fn.apply(null, args));
      return fn.apply(null, args);
    };
  });
})();

seedBuiltin();
paintHeader();
if(currentUser()){ landing(); } else { authMode = "login"; authScreen(); }
</script>
